[project]
name = "reconciler"
version = "0.1.0"
description = "Household inventory reconciler — joins Mealie meal plans + Grocy stock into vendor-split shopping lists"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-anyio>=0.0.0; python_version<'0'",
    "anyio>=4.6",
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest-httpx>=0.30",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
